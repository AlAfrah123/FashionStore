<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FashionStore</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: linear-gradient(135deg, #f3f0ff 0%, #ffffff 55%, #ebe8ff 100%);
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            padding: 40px 32px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.09);
            text-align: center;
        }
        h1 {
            margin: 0 0 8px;
            font-size: clamp(26px, 5vw, 32px);
        }
        p { margin: 0 0 24px; color: #555; line-height: 1.55; }
        .brand {
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 800;
            color: #635BFF;
            letter-spacing: 0.06em;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            background: #635BFF;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="card">
    <span class="brand">FashionStore</span>
    <h1>Welcome</h1>
    <p>Open the storefront to browse products, categories, and product detail pages.</p>
    <p><a class="btn" href="home">Enter store</a></p>
</div>
</body>
</html>
